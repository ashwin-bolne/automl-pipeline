dataset:
  path: data/house_prices.csv
  target: SalePrice

task:
  type: regression

split:
  test_size: 0.2
  random_state: 42

model:
  name: linear_regression

preprocessing:
  numeric:
    impute_strategy: median
    scale_method: standard

  categorical:
    impute_strategy: most_frequent
    encode_method: onehot 